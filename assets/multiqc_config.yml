report_comment: >
  This report has been generated by the <a href="https://github.com/aidantay/nf-smallrnaseq/tree/dev" target="_blank">aidantay/nf-smallrnaseq</a>
  analysis pipeline.
report_section_order:
  "nf-smallrnaseq-methods-description":
    order: -1000
  "software_versions":
    order: -1001
  "nf-smallrnaseq-summary":
    order: -1002

export_plots: true

disable_version_detection: true

run_modules:
  - fastqc
  - fastp
  - bowtie2
  - bowtie1
  - samtools
  - custom_content

## Module order
top_modules:
  - "fastqc":
      name: "FastQC: raw reads"
      path_filters_exclude:
        - "*trimmed*"
        - "*merged*"
  - "fastp"
  - "fastqc":
      name: "FastQC: after preprocessing"
      path_filters:
        - "*trimmed*"
  - "fastqc":
      name: "FastQC: after merging"
      path_filters:
        - "*merged*"
  - "bowtie2"
  - "samtools":
      name: "Samtools - Bowtie2"
      path_filters:
        - "*Bowtie2-*"
  - "bowtie1"
  - "samtools":
      name: "Samtools - Bowtie1"
      path_filters:
        - "*Bowtie-*"
  - "custom_content"

custom_data:
  shortstack_sum_counts:
    file_format: "tsv"
    section_name: "ShortStack Counts"
    description: "shows reads overlapping genomic features of different biotypes, counted by ShortStack."
    plot_type: "bargraph"
    pconfig:
      title: "Biotypes"
      xlab: "# Reads"
  deseq2_pca:
    file_format: "tsv"
    section_name: "DESeq2 PCA plot"
    description: "PCA plot between samples in the experiment.
                  These values are calculated using <a href='https://bioconductor.org/packages/release/bioc/html/DESeq2.html'>DESeq2</a>
                  in the <a href='https://github.com/aidantay/nf-smallrnaseq/blob/master/bin/deseq2_qc.r'><code>deseq2_qc.r</code></a> script."
    plot_type: "scatter"
    pconfig:
      title: 'DESeq2: Principal component plot'
      xlab: PC1
      ylab: PC2
      show_legend: true
  deseq2_clustering:
    file_format: "tsv"
    section_name: "DESeq2 sample similarity"
    description: "Heatmap generated from clustering by Euclidean distances between
                  <a href='https://bioconductor.org/packages/release/bioc/html/DESeq2.html' target='_blank'>DESeq2</a>
                  rlog values for each sample
                  in the <a href='https://github.com/aidantay/nf-smallrnaseq/blob/master/bin/deseq2_qc.r'><code>deseq2_qc.r</code></a> script."
    plot_type: "heatmap"
    pconfig:
      title: 'DESeq2: Heatmap of the sample-to-sample distances'
      xlog: True
      reverse_colors: True
  deseq2_rle:
    file_format: "tsv"
    section_name: "DESeq2 relative log expression"
    description: "RLE plot generated using the <a href='https://github.com/aidantay/nf-smallrnaseq/blob/master/bin/deseq2_qc.r'><code>deseq2_qc.r</code></a> script."
    plot_type: "boxplot"
    pconfig:
      title: 'DESeq2: Relative log expression'

## Sample name cleaning
extra_fn_clean_exts:
  - ".shortstack"
  - ".merged_condensed"

sp:
  deseq2_pca:
    fn: "deseq2.pca.vals.txt"
  deseq2_clustering:
    fn: "deseq2.sample.dists.txt"
  deseq2_rle:
    fn: "deseq2.rle.vals.txt"
  shortstack_sum_counts:
    fn: "*.shortstack.counts.vals.txt"
